spring.application.name=projekt1
# Dateibasierte H2-Datenbank (Daten bleiben nach Neustart erhalten)
spring.datasource.url=jdbc:h2:file:./data/aufgabendb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Tabellen automatisch anlegen und beim Neustart behalten
spring.jpa.hibernate.ddl-auto=update

# H2-Konsole im Browser unter /h2-console aktivieren
spring.h2.console.enabled=true

# Optional: Generierte SQL-Befehle in der Eclipse-Konsole anzeigen
spring.jpa.show-sql=true

# Test-User
spring.security.user.name=tay
spring.security.user.password=geheim123
