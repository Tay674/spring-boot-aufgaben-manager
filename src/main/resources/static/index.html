<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Meine Aufgaben-App</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            background: white;
            width: 100%;
            max-width: 760px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        h1 {
            margin-top: 0;
            text-align: center;
            color: #2c3e50;
        }
        .input-group, .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }
        .filter-bar {
            background-color: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            margin-bottom: 20px;
        }
        input[type="text"], input[type="date"], select {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background-color: white;
            font-family: inherit;
        }
        input[type="text"] {
            flex: 1 1 200px;
        }
        input[type="text"]:focus, input[type="date"]:focus, select:focus {
            outline: none;
            border-color: #3498db;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn-add {
            background-color: #3498db;
            color: white;
            font-size: 14px;
        }
        .btn-add:hover { background-color: #2980b9; }
        .btn-reset {
            background-color: #ecf0f1;
            color: #2c3e50;
            font-size: 13px;
        }
        .btn-reset:hover { background-color: #bdc3c7; }
        #fehlerMeldung {
            color: #e74c3c;
            font-size: 14px;
            margin: 5px 0 15px 0;
            min-height: 20px;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #eee;
            gap: 10px;
        }
        li:last-child { border-bottom: none; }
        .aufgabe-info {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }
        .aufgabe-text {
            font-size: 16px;
        }
        .erledigt {
            text-decoration: line-through;
            color: #95a5a6;
        }
        .badge {
            font-size: 12px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 12px;
        }
        .kategorie-badge {
            background-color: #e8f4fd;
            color: #2980b9;
        }
        .prio-NIEDRIG {
            background-color: #eef2f5;
            color: #636e72;
        }
        .prio-MITTEL {
            background-color: #fef5e7;
            color: #d68910;
        }
        .prio-HOCH {
            background-color: #fdedec;
            color: #c0392b;
        }
        .datum-badge {
            background-color: #f4f6f7;
            color: #566573;
        }
        .datum-ueberfaellig {
            background-color: #fdedec;
            color: #c0392b;
        }
        .btn-gruppe {
            display: flex;
            gap: 6px;
        }
        .btn-status {
            background-color: #2ecc71;
            color: white;
            font-size: 13px;
        }
        .btn-status:hover { background-color: #27ae60; }
        .btn-status.offen {
            background-color: #f39c12;
        }
        .btn-status.offen:hover { background-color: #d68910; }
        .btn-delete {
            background-color: #e74c3c;
            color: white;
            font-size: 13px;
        }
        .btn-delete:hover { background-color: #c0392b; }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header-bar h1 {
            margin: 0;
        }
        .btn-logout {
            background-color: #95a5a6;
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn-logout:hover {
            background-color: #7f8c8d;
        }
        .pagination-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        .btn-page {
            background-color: #34495e;
            color: white;
            font-size: 13px;
        }
        .btn-page:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <h1>Meine Aufgaben-App</h1>
            <a href="/logout" class="btn-logout">Abmelden</a>
        </div>

        <div class="input-group">
            <input type="text" id="neuerTitel" placeholder="Neue Aufgabe eingeben...">
            <select id="kategorieAuswahl">
                <option value="">Ohne Kategorie</option>
            </select>
            <select id="prioritaetAuswahl">
                <option value="NIEDRIG">Prio: Niedrig</option>
                <option value="MITTEL">Prio: Mittel</option>
                <option value="HOCH">Prio: Hoch</option>
            </select>
            <input type="date" id="faelligAmAuswahl" title="Fälligkeitsdatum">
            <button class="btn-add" onclick="aufgabeErstellen()">Hinzufügen</button>
        </div>
        <p id="fehlerMeldung"></p>

        <div class="filter-bar">
            <input type="text" id="sucheTitel" placeholder="Nach Titel suchen..." oninput="filterZuruecksetzenUndLaden()">
            <select id="filterStatus" onchange="filterZuruecksetzenUndLaden()">
                <option value="">Alle Status</option>
                <option value="false">Nur Offene</option>
                <option value="true">Nur Erledigte</option>
            </select>
            <select id="filterPrioritaet" onchange="filterZuruecksetzenUndLaden()">
                <option value="">Alle Prioritäten</option>
                <option value="HOCH">Hoch</option>
                <option value="MITTEL">Mittel</option>
                <option value="NIEDRIG">Niedrig</option>
            </select>
            <button class="btn-reset" onclick="alleFilterLeeren()">Filter zurücksetzen</button>
        </div>

        <ul id="aufgabenListe"></ul>

        <div class="pagination-bar">
            <button class="btn-page" id="btnZurueck" onclick="seiteWechseln(-1)">← Zurück</button>
            <span id="seitenInfo">Seite 1 von 1</span>
            <button class="btn-page" id="btnWeiter" onclick="seiteWechseln(1)">Weiter →</button>
        </div>
    </div>

    <script>
        let aktuelleSeite = 0;
        const seitenGroesse = 5;

        async function ladeKategorien() {
            const antwort = await fetch('/kategorien');
            const kategorien = await antwort.json();

            const select = document.getElementById('kategorieAuswahl');
			 select.innerHTML = '<option value="">Ohne Kategorie</option>';
			 kategorien.forEach(kat => {
                const option = document.createElement('option');
                option.value = kat.id;
                option.textContent = kat.name;
                select.appendChild(option);
            });
        }

        function formatiereDatum(isoDatum) {
            const [jahr, monat, tag] = isoDatum.split('-');
            return tag + '.' + monat + '.' + jahr;
        }

        function filterZuruecksetzenUndLaden() {
            aktuelleSeite = 0;
            ladeAufgaben();
        }

        function alleFilterLeeren() {
            document.getElementById('sucheTitel').value = '';
            document.getElementById('filterStatus').value = '';
            document.getElementById('filterPrioritaet').value = '';
            filterZuruecksetzenUndLaden();
        }

        function seiteWechseln(richtung) {
            aktuelleSeite += richtung;
            ladeAufgaben();
        }

        async function ladeAufgaben() {
            const params = new URLSearchParams();
            params.append('page', aktuelleSeite);
            params.append('size', seitenGroesse);

            const suche = document.getElementById('sucheTitel').value.trim();
            const status = document.getElementById('filterStatus').value;
            const prio = document.getElementById('filterPrioritaet').value;

            if (suche) params.append('titel', suche);
            if (status !== '') params.append('erledigt', status);
            if (prio) params.append('prioritaet', prio);

            const antwort = await fetch('/aufgaben?' + params.toString());
            const pageDaten = await antwort.json();

            const liste = document.getElementById('aufgabenListe');
            liste.innerHTML = '';

            const heuteIso = new Date().toISOString().split('T');

            pageDaten.content.forEach(aufgabe => {
                const eintrag = document.createElement('li');

                const infoDiv = document.createElement('div');
                infoDiv.className = 'aufgabe-info';
				const textSpan = document.createElement('span');
				textSpan.textContent = aufgabe.titel;
				textSpan.className = 'aufgabe-text' + (aufgabe.erledigt ? ' erledigt' : '');
				infoDiv.appendChild(textSpan);
				if (aufgabe.kategorieName) {
				const badge = document.createElement('span');
				badge.textContent = aufgabe.kategorieName;
				badge.className = 'badge kategorie-badge';
				infoDiv.appendChild(badge);
				}
				if (aufgabe.prioritaet) {
				const prioBadge = document.createElement('span');
				prioBadge.textContent = aufgabe.prioritaet;
				prioBadge.className = 'badge prio-' + aufgabe.prioritaet;
				infoDiv.appendChild(prioBadge);
				}
				if (aufgabe.faelligAm) {
				const datumBadge = document.createElement('span');
				const istUeberfaellig = !aufgabe.erledigt && aufgabe.faelligAm < heuteIso;
				datumBadge.textContent = 'Fällig: ' + formatiereDatum(aufgabe.faelligAm);
				datumBadge.className = 'badge ' + (istUeberfaellig ? 'datum-ueberfaellig' : 'datum-badge');
				infoDiv.appendChild(datumBadge);
				}
				const btnGruppe = document.createElement('div');
				btnGruppe.className = 'btn-gruppe';
				const statusBtn = document.createElement('button');
				statusBtn.textContent = aufgabe.erledigt ? 'Wieder öffnen' : 'Erledigt';
				statusBtn.className = 'btn-status' + (aufgabe.erledigt ? ' offen' : '');
				statusBtn.onclick = () => statusUmschalten(aufgabe);
				const loeschBtn = document.createElement('button');
				loeschBtn.textContent = 'Löschen';
				loeschBtn.className = 'btn-delete';
				loeschBtn.onclick = () => aufgabeLoeschen(aufgabe.id);
				btnGruppe.appendChild(statusBtn);
				btnGruppe.appendChild(loeschBtn);
				eintrag.appendChild(infoDiv);
				eintrag.appendChild(btnGruppe);
				liste.appendChild(eintrag);
				});
				const gesamtSeiten = Math.max(pageDaten.totalPages, 1);
				document.getElementById('seitenInfo').textContent = 'Seite ' + (pageDaten.number + 1) + ' von ' + gesamtSeiten + ' (' + pageDaten.totalElements + ' Aufgaben)';
				document.getElementById('btnZurueck').disabled = pageDaten.first;
				document.getElementById('btnWeiter').disabled = pageDaten.last;
				}
				async function aufgabeErstellen() {
				const titelFeld = document.getElementById('neuerTitel');
				const katSelect = document.getElementById('kategorieAuswahl');
				const prioSelect = document.getElementById('prioritaetAuswahl');
				const datumFeld = document.getElementById('faelligAmAuswahl');
				const fehlerFeld = document.getElementById('fehlerMeldung');
				fehlerFeld.textContent = '';
				const daten = {
				titel: titelFeld.value,
				erledigt: false,
				kategorieId: katSelect.value ? parseInt(katSelect.value) : null,
				prioritaet: prioSelect.value,
				faelligAm: datumFeld.value ? datumFeld.value : null
				};
				const antwort = await fetch('/aufgaben', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify(daten)
				});
				if (antwort.ok) {
				titelFeld.value = '';
				katSelect.value = '';
				prioSelect.value = 'NIEDRIG';
				datumFeld.value = '';
				ladeAufgaben();
				} else {
				const fehlerDaten = await antwort.json();
				fehlerFeld.textContent = fehlerDaten.titel || fehlerDaten.faelligAm || fehlerDaten.fehler || 'Fehler beim Speichern';
				}
				}
				async function statusUmschalten(aufgabe) {
				const antwort = await fetch('/aufgaben/' + aufgabe.id, {
				method: 'PUT',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({
				titel: aufgabe.titel,
				erledigt: !aufgabe.erledigt,
				kategorieId: aufgabe.kategorieId,
				prioritaet: aufgabe.prioritaet,
				faelligAm: aufgabe.faelligAm
				})
				});
				if (antwort.ok) {
				ladeAufgaben();
				}
				}
				async function aufgabeLoeschen(id) {
				const antwort = await fetch('/aufgaben/' + id, {
				method: 'DELETE'
				});
				if (antwort.ok) {
				ladeAufgaben();
				}
				}
				ladeKategorien();
				ladeAufgaben();
				        ladeKategorien();
				        ladeAufgaben();
				    </script>
				</body>
				</html>
