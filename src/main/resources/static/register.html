<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Registrieren - Meine Aufgaben-App</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        h1 {
            margin-top: 0;
            text-align: center;
            color: #2c3e50;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
            color: #555;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #3498db;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }
        button:hover {
            background-color: #2980b9;
        }
        #meldung {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
            min-height: 20px;
        }
        .fehler { color: #e74c3c; }
        .erfolg { color: #27ae60; font-weight: bold; }
        .login-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            color: #3498db;
            text-decoration: none;
        }
        .login-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Neues Konto erstellen</h1>

        <div class="form-group">
            <label for="username">Benutzername</label>
            <input type="text" id="username" placeholder="Mindestens 3 Zeichen">
        </div>

        <div class="form-group">
            <label for="password">Passwort</label>
            <input type="password" id="password" placeholder="Mindestens 6 Zeichen">
        </div>

        <button onclick="registrieren()">Registrieren</button>
        <p id="meldung"></p>

        <a href="/login" class="login-link">Bereits ein Konto? Jetzt anmelden</a>
    </div>

    <script>
        async function registrieren() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const meldung = document.getElementById('meldung');
            meldung.textContent = '';
            meldung.className = '';

            const antwort = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (antwort.ok) {
                meldung.className = 'erfolg';
                meldung.textContent = 'Registrierung erfolgreich! Weiterleitung zum Login...';
                setTimeout(() => {
                    window.location.href = '/login';
                }, 1500);
            } else {
                meldung.className = 'fehler';
                const fehlerDaten = await antwort.json();
                meldung.textContent = fehlerDaten.fehler || fehlerDaten.username || fehlerDaten.password || 'Registrierung fehlgeschlagen';
            }
        }
    </script>
</body>
</html>
